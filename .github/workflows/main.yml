name: Unzip Archive
on: [push] # یا هر زمان که بخواهید دستی اجرا شود (workflow_dispatch)
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip file
        uses: ihiroky/extract-action@v1
        with:
          file_path: 'pcb_v.zip' # نام دقیق فایل زیپ خود را اینجا بنویسید
          extract_dir: './extracted_files' # پوشه مقصد برای استخراج
      - name: Commit and Push changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add .
          git commit -m "Extracted zip file automatically"
          git push
